<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>Anti-Bestemmie</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #16a34a;
      --accent-off: #475569;
      --danger: #dc2626;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 320px;
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .section {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 0;
    }
    label { color: var(--muted); }
    label.main { color: var(--text); font-weight: 500; }
    .stat {
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
    }
    .stat-row { display: flex; align-items: baseline; gap: 8px; }
    .stat-row small { color: var(--muted); }
    .btn {
      display: block;
      width: 100%;
      padding: 8px 12px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      font: inherit;
      text-align: center;
      transition: background 0.15s;
    }
    .btn:hover { background: #334155; }
    .btn.danger { color: var(--danger); border-color: var(--danger); }
    /* Switch */
    .switch {
      position: relative;
      width: 40px;
      height: 22px;
      flex: 0 0 40px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: var(--accent-off);
      transition: 0.2s;
      border-radius: 22px;
    }
    .slider::before {
      content: '';
      position: absolute;
      height: 16px;
      width: 16px;
      left: 3px;
      top: 3px;
      background: white;
      transition: 0.2s;
      border-radius: 50%;
    }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::before { transform: translateX(18px); }
    .status-pill {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--accent-off);
      color: var(--text);
    }
    .status-pill.on { background: var(--accent); }
    footer {
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
    }
    a.options-link {
      color: var(--muted);
      text-decoration: none;
    }
    a.options-link:hover { color: var(--text); }
    .nano-status {
      font-size: 11px;
      color: var(--muted);
      padding: 4px 0;
    }
    .nano-status.ok { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>Anti-Bestemmie</h1>
    <span id="enabled-pill" class="status-pill">OFF</span>
  </header>

  <div class="section">
    <div class="row">
      <label class="main" for="enabled">Estensione attiva</label>
      <span class="switch">
        <input type="checkbox" id="enabled" />
        <span class="slider"></span>
      </span>
    </div>
    <div class="row">
      <label for="audio">Bip su audio del tab</label>
      <span class="switch">
        <input type="checkbox" id="audio" />
        <span class="slider"></span>
      </span>
    </div>
    <div class="nano-status" id="nano-status">Gemini Nano: verifica…</div>
    <div id="nano-progress-wrap" style="display:none; margin-top:6px">
      <div style="background:var(--accent-off); border-radius:4px; height:6px; overflow:hidden">
        <div id="nano-progress-bar" style="background:var(--accent); height:100%; width:0%; transition:width 0.2s"></div>
      </div>
      <div id="nano-progress-text" style="font-size:11px; color:var(--muted); margin-top:4px">0%</div>
    </div>
    <button class="btn" id="nano-force" style="display:none; margin-top:8px">Forza download Gemini Nano</button>
    <div style="font-size:11px; color:var(--muted); margin-top:6px">
      Debug: <a href="#" id="open-internals" style="color:var(--muted)">chrome://on-device-internals</a>
    </div>
  </div>

  <div class="section">
    <div class="stat-row">
      <span class="stat" id="stat-today">0</span>
      <small>censurate oggi</small>
    </div>
    <div class="stat-row">
      <span class="stat" id="stat-total" style="font-size:16px">0</span>
      <small>totale</small>
    </div>
  </div>

  <div class="section">
    <button class="btn" id="recensor">Ricensura pagina ora</button>
  </div>

  <footer>
    <a href="#" id="options-link" class="options-link">Opzioni avanzate →</a>
    <span>v0.1.0</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
